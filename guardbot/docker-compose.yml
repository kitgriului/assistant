version: '3.8'

services:
  guardbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: guardbot:1.0.0
    container_name: guardbot
    restart: unless-stopped
    
    env_file:
      - .env
    
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Moscow
    
    volumes:
      # Persist uploaded media
      - ./data/media:/app/data/media
      
      # Persist exports
      - ./data/export:/app/data/export
      
      # Logs (optional, for debugging)
      - ./logs:/app/logs
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.path.exists('.bot.lock') or exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Network mode (optional, if you need specific networking)
    # network_mode: "host"

